<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Try to change title dynamically -->
    <title>Contact Us</title>
    <meta name="description" content="Contact Breathe - The Finance Academy any time through our contact form.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.typekit.net/glh1rye.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- This is where nav bar will be located -->
    <header>
       <nav class="navbar navbar-expand-lg">
            <div class="container">
                <!-- Logo / Home link -->
                <a class="navbar-brand" href="index.html"><img src="images/Logo-green.svg" alt="Breathe Finance Academy Logo"></a>

                <!-- Hamburger button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>

                <!-- navbar links / this will collapse when certain screen size is reached -->
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                    <a class="nav-link" href="index.html#lessons-section">Lessons</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="contact.html">Contact Us</a>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
    </header> 

    <main class="contact-main">
        <section class="contact-hero"></section>
        <h1 class="contact-h1">We want to hear from YOU!</h1>
        
        <section class="contact-form">
            <form method="POST" id="form">
                <!-- //API Key -->
                <input type="hidden" name="access_key" value="17e678df-5583-4ec7-b336-18ca689a582d">

                <!-- //Sets the Subject line -->
                
                <input type="hidden" name="subject" value="New Submission from Web3Forms">
                
                <!-- //Checks for bots -->
                <input type="checkbox" name="botcheck" id="" style="display: none;">

                <!-- Custom Form Data -->
                <div class="contact-form__item">
                    <label for="user-email">Email</label>
                    <input type="email" name="email" required placeholder="@email.com">
                </div>

                <div class="contact-form__item">
                    <label for="name">First and Last Name</label>
                    <input type="text" name="name" required placeholder="Jane Doe">
                </div>

                <div class="contact-form__item">
                    <label for="phone-number">Phone Number</label>
                    <input type="text" name="phone" required placeholder="123-456-7890">
                </div>

                <div class="contact-form__item">
                    <textarea name="message" required placeholder="Tell us what your thoughts!"></textarea>
                </div>
                
                <button class="contact-button" type="submit">Submit</button>

                <div id="result"></div>
            </form>
        </section>
        

    </main>

    <footer class="home-footer-section">
        <div class=" home-footer-section__container container">
            <div>
                <a href="index.html"><img class="footer-logo" src="images/Logo-green.svg" alt="Breathe Finance Academy Logo"></a>
            </div>
            <div>
                <p class="footer-title">CONTACT US</p>
                <P>123-456-7890</P>
                <P>456 Freedom Drive SW, Orlando FL, 32817</P>
            </div>
            <div>
                <p class="footer-title">FOLLOW US</p>
                <a href="https://www.instagram.com/" target="_blank"><img class="social-icon" src="images/instagram.png" alt="Instagrm logo"></a>
                <a href="https://www.facebook.com/" target="_blank"><img class="facebook-icon" src="images/facebook.webp" alt="Facebook logo"></a>
                <a href="https://x.com/" target="_blank"><img class="social-icon" src="images/x.png" alt="X logo"></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="contact.js"></script>
</body>
</html>
